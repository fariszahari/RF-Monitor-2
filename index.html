<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>RF Voltage Monitor</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            text-align: center;

            background: #0f172a;

            color: white;

            padding: 20px;

            margin: 0;

        }


        h1 {

            margin-top: 10px;

            margin-bottom: 10px;

            font-size: 28px;

        }


        .status {

            margin-top: 10px;

            margin-bottom: 20px;

            font-size: 15px;

            color: #cbd5e1;

        }


        .indicator {

            width: 15px;

            height: 15px;

            border-radius: 50%;

            background: #64748b;

            display: inline-block;

            margin-right: 6px;

            vertical-align: middle;

        }


        .connected {

            background: #22c55e;

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.8);

        }


        .error {

            background: #ef4444;

            box-shadow:
                0 0 10px
                rgba(239, 68, 68, 0.8);

        }


        button {

            background: #0ea5e9;

            color: white;

            border: none;

            padding: 14px 26px;

            font-size: 16px;

            font-weight: bold;

            border-radius: 30px;

            cursor: pointer;

            transition: 0.2s;

            margin-bottom: 20px;

        }


        button:hover {

            background: #0284c7;

        }


        button:active {

            transform: scale(0.95);

        }


        button:disabled {

            background: #475569;

            cursor: not-allowed;

        }


        .card {

            background: #1e293b;

            padding: 25px;

            border-radius: 18px;

            margin: 20px auto;

            max-width: 450px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.3);

        }


        .unit {

            font-size: 18px;

            color: #94a3b8;

            margin-bottom: 10px;

        }


        .value {

            font-size: 52px;

            font-weight: bold;

            color: #38bdf8;

            margin: 10px 0;

            font-family: monospace;

        }


        .millivolt {

            font-size: 20px;

            color: #94a3b8;

            margin-bottom: 20px;

            font-family: monospace;

        }


        .threshold {

            font-size: 15px;

            color: #94a3b8;

            margin-top: 15px;

        }


        .milkStatus {

            padding: 18px;

            border-radius: 15px;

            font-size: 24px;

            font-weight: bold;

            margin-top: 20px;

            background: #166534;

            color: white;

        }


        .milkStatus.rosak {

            background: #dc2626;

            box-shadow:
                0 0 20px
                rgba(220, 38, 38, 0.6);

        }


        .milkStatus.normal {

            background: #166534;

        }


        .info {

            max-width: 450px;

            margin: 20px auto;

            padding: 15px;

            border-radius: 12px;

            background: #172033;

            color: #94a3b8;

            font-size: 13px;

            line-height: 1.6;

        }


        .alertBox {

            display: none;

            position: fixed;

            left: 20px;

            right: 20px;

            top: 50%;

            transform: translateY(-50%);

            max-width: 420px;

            margin: auto;

            background: #7f1d1d;

            color: white;

            padding: 30px 20px;

            border-radius: 20px;

            box-shadow:
                0 0 40px
                rgba(239,68,68,0.7);

            z-index: 1000;

        }


        .alertBox.show {

            display: block;

        }


        .alertTitle {

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .alertVoltage {

            font-size: 28px;

            font-family: monospace;

            font-weight: bold;

            margin: 15px 0;

        }


        .closeAlert {

            background: white;

            color: #991b1b;

            margin-top: 15px;

            margin-bottom: 0;

        }


        .closeAlert:hover {

            background: #f1f5f9;

        }

    </style>

</head>


<body>


    <h1>
        📡 RF Voltage Monitor
    </h1>


    <!-- STATUS -->

    <div class="status">

        <span
            id="indicator"
            class="indicator"
        ></span>

        <span id="status">
            Sedia untuk disambung
        </span>

    </div>


    <!-- CONNECT BUTTON -->

    <button
        id="connectBtn"
        onclick="sambungBLE()"
    >
        🔵 Sambung ke ESP32
    </button>


    <!-- MAIN CARD -->

    <div class="card">


        <div class="unit">
            VOLTAN AD8318
        </div>


        <div
            class="value"
            id="voltValue"
        >
            --.--- V
        </div>


        <div
            class="millivolt"
            id="milliVoltValue"
        >
            ---- mV
        </div>


        <!-- MILK STATUS -->

        <div
            id="milkStatus"
            class="milkStatus normal"
        >
            🥛 NORMAL
        </div>


        <!-- THRESHOLD -->

        <div class="threshold">

            Threshold SUSU ROSAK:

            <strong>
                2.000 V
            </strong>

        </div>

    </div>


    <!-- INFORMATION -->

    <div class="info">

        <strong>ESP32 BLE</strong>
        <br>

        Device:
        <span id="deviceName">
            ESP32_RF_BLE
        </span>

        <br><br>

        Bacaan diterima secara wireless
        daripada AD8318 melalui ESP32.

    </div>


    <!-- ALERT -->

    <div
        id="alertBox"
        class="alertBox"
    >

        <div class="alertTitle">
            🚨 SUSU ROSAK
        </div>


        <div>
            Voltan telah melebihi
            threshold.
        </div>


        <div
            id="alertVoltage"
            class="alertVoltage"
        >
            2.000 V
        </div>


        <div>
            Threshold:
            <strong>
                2.000 V
            </strong>
        </div>


        <button
            class="closeAlert"
            onclick="tutupAlert()"
        >
            OK
        </button>

    </div>


<script>


// ============================================================
// BLE CONFIGURATION
// ============================================================


// Nama BLE ESP32
const BLE_DEVICE_NAME =
    "ESP32_RF_BLE";


// Service UUID
const SERVICE_UUID =
    "4fafc201-1fb5-459e-8fcc-c5c9c331914b";


// Characteristic UUID
const CHARACTERISTIC_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26a8";


// ============================================================
// THRESHOLD
// ============================================================
//
// 2.000 V = threshold SUSU ROSAK
//
// Threshold tidak dipaparkan sebagai
// input yang boleh diubah pengguna.
// Nilai ditetapkan di dalam kod.
//

const VOLTAGE_THRESHOLD =
    2.000;


// ============================================================
// BLE VARIABLES
// ============================================================

let bluetoothDevice = null;

let characteristic = null;


// ============================================================
// ALERT CONTROL
// ============================================================

let alertSudahKeluar = false;


// ============================================================
// ELEMENTS
// ============================================================

const statusElement =
    document.getElementById("status");

const indicatorElement =
    document.getElementById("indicator");

const connectButton =
    document.getElementById("connectBtn");

const voltValueElement =
    document.getElementById("voltValue");

const milliVoltElement =
    document.getElementById("milliVoltValue");

const milkStatusElement =
    document.getElementById("milkStatus");

const alertBox =
    document.getElementById("alertBox");

const alertVoltageElement =
    document.getElementById("alertVoltage");


// ============================================================
// CHECK WEB BLUETOOTH
// ============================================================

function periksaWebBluetooth() {

    if (
        !navigator.bluetooth
    ) {

        statusElement.innerText =
            "Browser ini tidak menyokong Web Bluetooth";

        indicatorElement.className =
            "indicator error";

        connectButton.disabled =
            true;

        return false;
    }

    return true;
}


// ============================================================
// CONNECT BLE
// ============================================================

async function sambungBLE() {


    if (!periksaWebBluetooth()) {
        return;
    }


    try {


        // ----------------------------------------------------
        // STATUS
        // ----------------------------------------------------

        statusElement.innerText =
            "Sedang mencari ESP32...";


        indicatorElement.className =
            "indicator";


        connectButton.disabled =
            true;


        // ----------------------------------------------------
        // REQUEST DEVICE
        // ----------------------------------------------------

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                filters: [

                    {
                        name:
                            BLE_DEVICE_NAME
                    }

                ],

                optionalServices: [

                    SERVICE_UUID

                ]

            });


        // ----------------------------------------------------
        // DISCONNECTED EVENT
        // ----------------------------------------------------

        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            apabilaTerputus
        );


        // ----------------------------------------------------
        // CONNECT GATT
        // ----------------------------------------------------

        statusElement.innerText =
            "Menyambung kepada ESP32...";


        const server =
            await bluetoothDevice.gatt.connect();


        // ----------------------------------------------------
        // GET SERVICE
        // ----------------------------------------------------

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        // ----------------------------------------------------
        // GET CHARACTERISTIC
        // ----------------------------------------------------

        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        // ----------------------------------------------------
        // START NOTIFICATIONS
        // ----------------------------------------------------

        await characteristic.startNotifications();


        characteristic.addEventListener(
            "characteristicvaluechanged",
            terimaDataBLE
        );


        // ----------------------------------------------------
        // SUCCESS
        // ----------------------------------------------------

        statusElement.innerText =
            "Disambungkan! 🟢";


        indicatorElement.className =
            "indicator connected";


        connectButton.innerText =
            "🟢 ESP32 Disambungkan";


        connectButton.disabled =
            true;


    }

    catch (error) {


        console.error(
            "BLE ERROR:",
            error
        );


        statusElement.innerText =
            "Ralat: " +
            error.message;


        indicatorElement.className =
            "indicator error";


        connectButton.innerText =
            "🔵 Cuba Sambung Semula";


        connectButton.disabled =
            false;

    }

}


// ============================================================
// RECEIVE BLE DATA
// ============================================================
//
// ESP32 menghantar:
//
// 1.732
//
// bukannya:
//
// F=2450.000MHz,V=1.732
//
// ============================================================

function terimaDataBLE(
    event
) {


    try {


        const decoder =
            new TextDecoder("utf-8");


        const dataRaw =
            decoder
                .decode(
                    event.target.value
                )
                .trim();


        console.log(
            "Data BLE:",
            dataRaw
        );


        // ----------------------------------------------------
        // CONVERT STRING → NUMBER
        // ----------------------------------------------------

        const voltage =
            parseFloat(dataRaw);


        // ----------------------------------------------------
        // CHECK VALID VOLTAGE
        // ----------------------------------------------------

        if (
            isNaN(voltage)
        ) {

            console.warn(
                "Data voltage tidak sah:",
                dataRaw
            );

            return;
        }


        // ----------------------------------------------------
        // DISPLAY VOLT
        // ----------------------------------------------------

        voltValueElement.innerText =
            voltage.toFixed(3) +
            " V";


        // ----------------------------------------------------
        // DISPLAY MILLIVOLT
        // ----------------------------------------------------

        const millivolt =
            voltage * 1000;


        milliVoltElement.innerText =
            millivolt.toFixed(0) +
            " mV";


        // ----------------------------------------------------
        // THRESHOLD CHECK
        // ----------------------------------------------------

        if (
            voltage >
            VOLTAGE_THRESHOLD
        ) {


            // ----------------------------------------------
            // SUSU ROSAK
            // ----------------------------------------------

            milkStatusElement.innerText =
                "🚨 SUSU ROSAK";


            milkStatusElement.className =
                "milkStatus rosak";


            // ----------------------------------------------
            // ALERT
            // ----------------------------------------------

            if (
                !alertSudahKeluar
            ) {

                alertSudahKeluar =
                    true;


                tunjukAlert(
                    voltage
                );
            }


        }

        else {


            // ----------------------------------------------
            // NORMAL
            // ----------------------------------------------

            milkStatusElement.innerText =
                "🥛 NORMAL";


            milkStatusElement.className =
                "milkStatus normal";


            // ----------------------------------------------
            // RESET ALERT
            //
            // Jika voltage turun kembali
            // ke bawah/equal 2V,
            // alert boleh muncul semula
            // apabila naik melebihi 2V.
            // ----------------------------------------------

            alertSudahKeluar =
                false;

        }

    }

    catch (error) {

        console.error(
            "Data processing error:",
            error
        );

    }

}


// ============================================================
// SHOW ALERT
// ============================================================

function tunjukAlert(
    voltage
) {


    alertVoltageElement.innerText =
        voltage.toFixed(3) +
        " V";


    alertBox.classList.add(
        "show"
    );


    // --------------------------------------------------------
    // Browser alert tambahan
    // --------------------------------------------------------
    //
    // Tidak digunakan kerana dialog browser
    // boleh mengganggu pengalaman pengguna.
    //
    // UI alert merah di atas sudah mencukupi.
    // --------------------------------------------------------

}


// ============================================================
// CLOSE ALERT
// ============================================================

function tutupAlert() {

    alertBox.classList.remove(
        "show"
    );

}


// ============================================================
// DISCONNECTED
// ============================================================

function apabilaTerputus() {


    statusElement.innerText =
        "Terputus daripada ESP32";


    indicatorElement.className =
        "indicator error";


    connectButton.innerText =
        "🔵 Sambung Semula";


    connectButton.disabled =
        false;


    characteristic =
        null;


}


// ============================================================
// PAGE LOAD
// ============================================================

window.addEventListener(
    "load",
    function() {

        periksaWebBluetooth();

    }
);


</script>


</body>

</html>
