<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RF Voltage Monitor</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            background: #0f172a;
            color: white;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .value {
            font-size: 48px;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
            font-family: monospace;
        }

        .unit {
            font-size: 18px;
            color: #94a3b8;
        }

        .status {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #64748b;
            display: inline-block;
            margin-right: 6px;
        }

        .connected {
            background: #22c55e;
        }

        .error {
            background: #ef4444;
        }

        .small {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>📡 RF Voltage Monitor</h1>

    <div class="status">
        <span id="indicator" class="indicator"></span>
        <span id="status">Sedia untuk disambung</span>
    </div>

    <button id="connectBtn" onclick="sambungBLE()">
        Sambung ke ESP32
    </button>

    <div class="card">

        <div class="unit">
            VOLTAN AD8318
        </div>

        <div class="value" id="voltValue">
            --.--- V
        </div>

        <div class="small" id="milliVoltValue">
            ---- mV
        </div>

    </div>


<script>

const SERVICE_UUID =
    "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

const CHARACTERISTIC_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26a8";


async function sambungBLE() {

    try {

        document.getElementById("status").innerText =
            "Sedang mencari ESP32...";

        document.getElementById("indicator").className =
            "indicator";


        // Cari ESP32
        const device = await navigator.bluetooth.requestDevice({

            filters: [
                {
                    name: "ESP32_RF_BLE"
                }
            ],

            optionalServices: [
                SERVICE_UUID
            ]

        });


        document.getElementById("status").innerText =
            "Menyambung...";


        // Sambung GATT
        const server =
            await device.gatt.connect();


        // Dapatkan service
        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        // Dapatkan characteristic
        const characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        // Status berjaya
        document.getElementById("status").innerText =
            "Disambungkan! 🟢";

        document.getElementById("indicator").className =
            "indicator connected";

        document.getElementById("connectBtn").style.display =
            "none";


        // Mulakan notification
        await characteristic.startNotifications();


        characteristic.addEventListener(
            "characteristicvaluechanged",
            function(event) {

                const decoder =
                    new TextDecoder("utf-8");

                const dataRaw =
                    decoder.decode(
                        event.target.value
                    ).trim();


                // ESP32 sekarang menghantar:
                //
                // 1.732
                //
                // bukannya:
                //
                // -15.4,1.73

                const voltage =
                    parseFloat(dataRaw);


                if (!isNaN(voltage)) {

                    // Papar Volt
                    document.getElementById(
                        "voltValue"
                    ).innerText =
                        voltage.toFixed(3) + " V";


                    // Papar millivolt
                    const millivolt =
                        voltage * 1000;


                    document.getElementById(
                        "milliVoltValue"
                    ).innerText =
                        millivolt.toFixed(0) + " mV";
                }

            }
        );


        // Jika connection terputus
        device.addEventListener(
            "gattserverdisconnected",
            function() {

                document.getElementById("status").innerText =
                    "Terputus daripada ESP32";

                document.getElementById("indicator").className =
                    "indicator error";

                document.getElementById("connectBtn").style.display =
                    "inline-block";
            }
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Ralat: " + error.message;

        document.getElementById("indicator").className =
            "indicator error";
    }
}

</script>

</body>
</html>
